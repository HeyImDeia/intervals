name: Build IPA

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Generate Xcode project
        run: brew install xcodegen && xcodegen generate

      - name: Build (unsigned — Sideloadly signs it with your Apple ID)
        run: |
          xcodebuild -project Intervals.xcodeproj -target Intervals -configuration Release \
            -sdk iphoneos SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build

      - name: Package .ipa
        run: |
          mkdir Payload
          cp -R build/Release-iphoneos/Intervals.app Payload/
          zip -qr Intervals.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Intervals-ipa
          path: Intervals.ipa
