name: Intervals
options:
  bundleIdPrefix: com.heyimdeia
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Intervals:
    type: application
    platform: iOS
    sources: [Sources, Resources]
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Intervals
        UILaunchScreen: {}
        UIBackgroundModes: [audio]          # keeps the timer and voice cues alive with the screen locked
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.heyimdeia.intervals
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
